name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git \
            rust \
            gtk4 libadwaita \
            pkgconf \
            xorg-server-xvfb \
            desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Desktop file validate
        run: desktop-file-validate data/io.github.sureserverman.AppImageControl.desktop
      - name: AppStream validate
        run: appstreamcli validate --no-net data/io.github.sureserverman.AppImageControl.metainfo.xml
      - name: Verify portmux-port wiring
        # Drives the same checks documented in
        # scripts/verify-portmux-port-wiring.sh:
        #   - env probes (gtk4 >= 4.21, xvfb-run)
        #   - cargo check on both crates
        #   - core lib tests (redundant with `cargo test --workspace`
        #     above; kept for an isolated signal if anything else
        #     drifts)
        #   - CLI pre-flight test 4a: missing portmux-port → install
        #     hint + non-zero exit
        #   - CLI pre-flight test 4b: stub portmux-port → probe passes
        #     and seed loop reaches the per-instance phase
        #   - GUI startup smoke under xvfb-run (catches init panics
        #     from the portmux_port_probe_runtime wiring in main.rs)
        # Section 2's optional "build portmux-port from sibling repo"
        # warns and skips on CI (no sibling checkout); that's expected.
        run: |
          chmod +x scripts/verify-portmux-port-wiring.sh
          LOG="$RUNNER_TEMP/verify-portmux-port-wiring.log" \
            ./scripts/verify-portmux-port-wiring.sh
      - name: Upload verify-wiring log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-portmux-port-wiring-log
          path: ${{ runner.temp }}/verify-portmux-port-wiring.log
          if-no-files-found: warn
