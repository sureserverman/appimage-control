name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git \
            rust \
            gtk4 libadwaita \
            pkgconf \
            desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Desktop file validate
        run: desktop-file-validate data/io.github.sureserverman.AppImageControl.desktop
      - name: AppStream validate
        run: appstreamcli validate --no-net data/io.github.sureserverman.AppImageControl.metainfo.xml
