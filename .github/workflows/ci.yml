name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:ece6c971fec3c532fd508bce299a446deaf469feecbfe7c353e995bc1a5e7bba # latest as of 2026-11-05
    steps:
      - name: Install system deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git \
            rust \
            gtk4 libadwaita \
            pkgconf \
            xorg-server-xvfb \
            desktop-file-utils appstream \
            gettext
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: CLI doc sync
        # README "CLI surface" section must list exactly the flags that
        # print_help() accepts (scripts/verify-cli-doc-sync.sh, static grep).
        run: sh scripts/verify-cli-doc-sync.sh
      - name: Translation template up to date
        # po/appimage-control.pot must hold exactly the strings the GUI passes to
        # tr/trc/ntr; the i18n unit tests then check every po/*.po against it.
        run: sh scripts/update-po.sh --check
      - name: Desktop file validate
        run: desktop-file-validate data/io.github.sureserverman.AppImageControl.desktop
      - name: AppStream validate
        run: appstreamcli validate --no-net data/io.github.sureserverman.AppImageControl.metainfo.xml
