name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:ece6c971fec3c532fd508bce299a446deaf469feecbfe7c353e995bc1a5e7bba # latest as of 2026-11-05
    steps:
      - name: Install system deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git \
            rust \
            gtk4 libadwaita \
            pkgconf \
            xorg-server-xvfb \
            desktop-file-utils appstream
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: CLI doc sync
        # README "CLI surface" section must list exactly the flags that
        # print_help() accepts (scripts/verify-cli-doc-sync.sh, static grep).
        run: sh scripts/verify-cli-doc-sync.sh
      - name: Desktop file validate
        run: desktop-file-validate data/io.github.sureserverman.AppImageControl.desktop
      - name: AppStream validate
        run: appstreamcli validate --no-net data/io.github.sureserverman.AppImageControl.metainfo.xml
      - name: Verify portmux-port wiring
        # Drives the same checks documented in
        # scripts/verify-portmux-port-wiring.sh:
        #   - env probes (gtk4 >= 4.21, xvfb-run)
        #   - cargo check on both crates
        #   - core lib tests (redundant with `cargo test --workspace`
        #     above; kept for an isolated signal if anything else
        #     drifts)
        #   - CLI pre-flight test 4a: missing portmux-port → install
        #     hint + non-zero exit
        #   - CLI pre-flight test 4b: stub answering `configure-app` →
        #     probe passes and seed loop reaches the per-instance phase
        #   - CLI pre-flight test 4c: portmux without `configure-app` →
        #     install hint + non-zero exit
        #   - GUI startup smoke under xvfb-run (catches init panics
        #     from the portmux_port_probe_runtime wiring in main.rs)
        # Section 2's optional "build portmux-port from sibling repo"
        # warns and skips on CI (no sibling checkout); that's expected.
        run: |
          chmod +x scripts/verify-portmux-port-wiring.sh
          LOG="$RUNNER_TEMP/verify-portmux-port-wiring.log" \
            ./scripts/verify-portmux-port-wiring.sh
      - name: Upload verify-wiring log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-portmux-port-wiring-log
          path: ${{ runner.temp }}/verify-portmux-port-wiring.log
          if-no-files-found: warn
