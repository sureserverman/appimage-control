app-id: io.github.appimagecontrol.AppImageControl
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: appimage-control
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-data/appimages
  - --filesystem=xdg-data/applications
  - --filesystem=xdg-data/icons
modules:
  - name: appimage-control
    buildsystem: simple
    build-commands:
      - cargo build --release -p appimage-control
      - install -Dm755 target/release/appimage-control /app/bin/appimage-control-bin
      - printf '%s\n' '#!/bin/sh' 'export APPIMAGE_CONTROL_CATALOG=/app/share/appimage-control/catalog.json' 'exec /app/bin/appimage-control-bin "$@"' > /app/bin/appimage-control
      - chmod 755 /app/bin/appimage-control
      - install -Dm644 data/io.github.appimagecontrol.AppImageControl.desktop /app/share/applications/io.github.appimagecontrol.AppImageControl.desktop
      - install -Dm644 data/io.github.appimagecontrol.AppImageControl.metainfo.xml /app/share/metainfo/io.github.appimagecontrol.AppImageControl.metainfo.xml
      - install -Dm644 data/catalog.json /app/share/appimage-control/catalog.json
      - install -Dm644 crates/gui/assets/app-icon/io.github.appimagecontrol.AppImageControl-128.png /app/share/icons/hicolor/128x128/apps/io.github.appimagecontrol.AppImageControl.png
      - install -Dm644 crates/gui/assets/app-icon/io.github.appimagecontrol.AppImageControl-256.png /app/share/icons/hicolor/256x256/apps/io.github.appimagecontrol.AppImageControl.png
      - install -Dm644 crates/gui/assets/app-icon/io.github.appimagecontrol.AppImageControl-512.png /app/share/icons/hicolor/512x512/apps/io.github.appimagecontrol.AppImageControl.png
    sources:
      - type: dir
        path: ..
