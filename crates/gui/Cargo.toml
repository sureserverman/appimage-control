[package]
name = "appimage-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 desktop app to manage AppImage installations"

[package.metadata.appimage-control]
app-id = "io.github.appimagecontrol.AppImageControl"
desktop-file = "data/io.github.appimagecontrol.AppImageControl.desktop"
metainfo-file = "data/io.github.appimagecontrol.AppImageControl.metainfo.xml"

[[bin]]
name = "appimage-control"
path = "src/main.rs"

[dependencies]
appimage_control_core = { path = "../core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }

[dev-dependencies]
tempfile = "3.27.0"
