[package]
name = "appimage-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 desktop app to manage AppImage installations"

[package.metadata.appimage-control]
app-id = "io.github.sureserverman.AppImageControl"
desktop-file = "data/io.github.sureserverman.AppImageControl.desktop"
metainfo-file = "data/io.github.sureserverman.AppImageControl.metainfo.xml"

[[bin]]
name = "appimage-control"
path = "src/main.rs"

[dependencies]
appimage_control_core = { path = "../core" }
dirs = "6"
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }

[dev-dependencies]
tempfile = "3.27.0"
